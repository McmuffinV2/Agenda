<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetRoute - Iniciar Sesión</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <style>
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            overflow: hidden;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 3rem;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            animation: fadeIn 0.6s ease-out forwards;
        }

        .login-card .logo {
            justify-content: center;
            padding: 0;
            margin-bottom: 2rem;
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .login-card .logo i {
            font-size: 3rem;
        }

        .login-card form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .login-card .input-group {
            text-align: left;
        }

        .login-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="login-page">
    <div class="login-card">
        <div class="logo">
            <i class="bx bx-wifi"></i>
            <span>Sanfercom</span>
        </div>
        <p>Inicia sesión para continuar</p>
        <form id="loginForm">
            <div class="input-group">
                <label>Usuario</label>
                <input type="text" id="username" required placeholder="Ej. admin o tu nombre" autofocus>
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="password" required placeholder="Ingresa cualquier contraseña"
                    autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary mt-1">
                Ingresar <i class="bx bx-right-arrow-alt fs-1-2"></i>
            </button>
        </form>
    </div>

    <script src="db.js"></script>
    <script src="Login.js"></script>
</body>

</html>
